name: Build & Release APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk "../SmartphoneRenkei-v${{ steps.ver.outputs.name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: SmartphoneRenkei-apk
          path: SmartphoneRenkei-*.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: スマートフォン連携 v${{ steps.ver.outputs.name }}
          body_path: android/RELEASE_NOTES.md
          files: SmartphoneRenkei-*.apk
          make_latest: true
