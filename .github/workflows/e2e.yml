name: E2E (pairing over WebRTC)
on: workflow_dispatch
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.49 && npx playwright install --with-deps chromium
      - run: node e2e/pair.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: e2e/*.png }
